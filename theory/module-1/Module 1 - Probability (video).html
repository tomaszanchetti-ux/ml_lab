<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module 1 — Probability in 5 minutes</title>
<style>
  :root { --bg:#0E1417; --panel:#151D21; --ink:#E6EDF0; --mut:#9AA9B1; --acc:#7DBDD6; --rule:#232F35; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:12px 16px 28px; }
  canvas { width:100%; height:auto; display:block; background:var(--bg); border:1px solid var(--rule); border-radius:6px; cursor:pointer; }
  .bar { display:flex; align-items:center; gap:12px; margin-top:10px; flex-wrap:wrap; }
  button, select { background:var(--panel); color:var(--ink); border:1px solid var(--rule); border-radius:5px; padding:7px 12px; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  #play { min-width:84px; font-weight:600; }
  #time { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--mut); min-width:96px; }
  #track { position:relative; flex:1; min-width:200px; height:16px; background:var(--panel); border:1px solid var(--rule); border-radius:8px; cursor:pointer; overflow:hidden; }
  #fill { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--acc); opacity:.55; }
  .tick { position:absolute; top:0; bottom:0; width:1px; background:#3a4a52; }
  label { font-size:13px; color:var(--mut); display:flex; align-items:center; gap:5px; cursor:pointer; }
  .scenes { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .scenes button { font-size:12px; padding:4px 9px; color:var(--mut); }
  .scenes button.on { color:var(--bg); background:var(--acc); border-color:var(--acc); }
  .hint { color:var(--mut); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="bar">
    <button id="play">▶ Play</button>
    <span id="time">0:00 / 0:00</span>
    <div id="track"><div id="fill"></div></div>
    <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select>
    <label><input type="checkbox" id="snd" checked> Sound</label>
    <label><input type="checkbox" id="voice"> Voice-over</label>
    <select id="voicesel" title="Voice"></select>
  </div>
  <div class="scenes" id="scenes"></div>
  <div class="hint">Space = play/pause · ← → = previous / next scene · click the bar or a chip to jump. Voice-over: pick an English voice in the menu next to the checkbox (it plays a sample when you change it).</div>
</div>
<script>
(() => {
const cv = document.getElementById('c'), c = cv.getContext('2d');
const W = 1280, H = 720;
const COL = { bg:'#0E1417', panel:'#151D21', ink:'#E6EDF0', mut:'#9AA9B1', faint:'#4A5A62', acc:'#7DBDD6', red:'#E4907E', green:'#74C7A0', yel:'#E5C07B', rule:'#232F35' };

/* ---------- helpers ---------- */
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const ease = t => t<.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
const A = (t, s, d=0.7) => ease(clamp((t-s)/d));          // fade-in 0..1 starting at s
function rng(seed){ let a = seed>>>0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function gauss(r){ let u=0,v=0; while(u===0) u=r(); while(v===0) v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function txt(s, x, y, o={}) {
  c.save(); c.globalAlpha = (o.alpha ?? 1) * c.globalAlpha;
  c.font = `${o.weight||400} ${o.size||24}px ${o.mono ? 'ui-monospace,Menlo,monospace' : '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'}`;
  c.fillStyle = o.color || COL.ink; c.textAlign = o.align || 'left'; c.textBaseline = o.base || 'alphabetic';
  c.fillText(s, x, y); c.restore();
}
function wrap(s, x, y, maxW, lh, o={}) {
  c.save(); c.font = `${o.weight||400} ${o.size||24}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif`;
  const words = s.split(' '); let line = '', lines = [];
  for (const w of words) { const t = line ? line+' '+w : w; if (c.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); c.restore();
  lines.forEach((l,i) => txt(l, x, y + i*lh, o)); return lines.length;
}
function rect(x,y,w,h,col,alpha=1,r=0){ c.save(); c.globalAlpha*=alpha; c.fillStyle=col; if(r){ c.beginPath(); c.roundRect(x,y,w,h,r); c.fill(); } else c.fillRect(x,y,w,h); c.restore(); }
function strokeRect(x,y,w,h,col,alpha=1,lw=1.5,r=0){ c.save(); c.globalAlpha*=alpha; c.strokeStyle=col; c.lineWidth=lw; c.beginPath(); r?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h); c.stroke(); c.restore(); }
function line(x1,y1,x2,y2,col,alpha=1,lw=2,dash){ c.save(); c.globalAlpha*=alpha; c.strokeStyle=col; c.lineWidth=lw; if(dash) c.setLineDash(dash); c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.restore(); }
function dot(x,y,r,col,alpha=1){ c.save(); c.globalAlpha*=alpha; c.fillStyle=col; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); c.restore(); }
function arrow(x1,y1,x2,y2,col,alpha=1,lw=2.5){ line(x1,y1,x2,y2,col,alpha,lw); const a=Math.atan2(y2-y1,x2-x1); c.save(); c.globalAlpha*=alpha; c.fillStyle=col; c.beginPath(); c.moveTo(x2,y2); c.lineTo(x2-12*Math.cos(a-.4),y2-12*Math.sin(a-.4)); c.lineTo(x2-12*Math.cos(a+.4),y2-12*Math.sin(a+.4)); c.fill(); c.restore(); }
const fmt = n => n.toLocaleString('en-US');

/* ---------- precomputed data (seeded so scrubbing is stable) ---------- */
const flips = (() => { const r = rng(7), a=[]; for(let i=0;i<400;i++) a.push(r()<.5); return a; })();
const gridOrder = (() => { const r = rng(11), a=[...Array(1000).keys()]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; })();
const setB = new Set(gridOrder.slice(0,123)), setAB = new Set(gridOrder.slice(0,42));
const binom = (() => { const r = rng(21), a=[]; for(let s=0;s<320;s++){ const row=[]; let k=0; for(let i=0;i<20;i++){ const d=r()<.2; row.push(d); if(d)k++; } a.push({row,k}); } return a; })();
function binomPMF(n,p,k){ let cmb=1; for(let i=0;i<k;i++) cmb = cmb*(n-i)/(i+1); return cmb*Math.pow(p,k)*Math.pow(1-p,n-k); }
function poisSample(r, lam){ const L=Math.exp(-lam); let k=0,p=1; do { k++; p*=r(); } while(p>L); return k-1; }
const pois = (() => { const r = rng(33), a=[]; for(let i=0;i<48;i++){ const k=poisSample(r,2), ev=[]; for(let j=0;j<k;j++) ev.push(r()); a.push({k,ev}); } return a; })();
const clus = (() => { const r = rng(44), a=[]; for(let i=0;i<48;i++){ const burst = r()<.14; const k = burst ? 9+Math.floor(r()*5) : (r()<.55?0:1); const ev=[]; for(let j=0;j<k;j++) ev.push(burst ? .3+r()*.4 : r()); a.push({k,ev}); } return a; })();
const stats = arr => { const n=arr.length; if(!n) return {m:0,v:0}; const m=arr.reduce((s,x)=>s+x,0)/n; const v=arr.reduce((s,x)=>s+(x-m)*(x-m),0)/n; return {m,v}; };
const logn = (() => { const r = rng(55), a=[]; for(let i=0;i<3000;i++) a.push(Math.exp(3.5+1.1*gauss(r))); return a; })();
const lognMed = (() => { const s=[...logn].sort((a,b)=>a-b); return s[1500]; })(), lognMean = logn.reduce((s,x)=>s+x,0)/logn.length;
const portA = (() => { const r=rng(66), a=[]; for(let i=0;i<60;i++) a.push(2400+150*gauss(r)); return a; })();
const portB = (() => { const r=rng(67), a=[]; for(let i=0;i<60;i++) a.push(r()<.85 ? 600+150*gauss(r) : 12600+800*gauss(r)); return a; })();

/* ---------- shared grid of 1,000 customers ---------- */
const GX=70, GY=128, GS=17.6, GC=40, GR=25;
function gridPos(i){ return [GX + (i%GC)*GS + 8, GY + Math.floor(i/GC)*GS + 8]; }

/* ---------- scenes ---------- */
const S = [];

S.push({ title:'Probability in five minutes', dur:8,
  cap:[[0,'Module one: probability. Fourteen ideas, each one with a picture.'],[4,'Rules first, then random variables, then the distributions.']],
  draw(t){
    txt('MODULE 1', 640, 250, {size:26, color:COL.acc, align:'center', mono:true, alpha:A(t,0)});
    txt('Probability', 640, 340, {size:96, weight:700, align:'center', alpha:A(t,.3)});
    txt('rules  ·  random variables  ·  Bernoulli  ·  Binomial  ·  Poisson  ·  Normal', 640, 410, {size:26, color:COL.mut, align:'center', alpha:A(t,1.2)});
    txt('Revolut · Machine Learning 1 (Basics) · 8 October', 640, 470, {size:20, color:COL.faint, align:'center', alpha:A(t,2)});
  }});

S.push({ title:'Probability = long-run frequency', dur:22,
  cap:[[0,'Flip a fair coin. After a few flips, the share of heads can be anything.'],[7,'Keep flipping, and the share settles towards one half.'],[13,'That is what a probability is: the fraction of times something happens in the long run.'],[18,'A fraud rate of zero point two percent means two in every thousand transactions.']],
  draw(t){
    const n = Math.max(1, Math.floor(400*Math.pow(clamp((t-1)/15),1.8)));
    let h=0; const px=380, py=150, pw=820, ph=380;
    strokeRect(px,py,pw,ph,COL.rule); line(px,py+ph/2,px+pw,py+ph/2,COL.faint,1,1.5,[6,6]); txt('0.5', px-12, py+ph/2+6, {size:18,color:COL.mut,align:'right'});
    txt('1', px-12, py+8, {size:18,color:COL.mut,align:'right'}); txt('0', px-12, py+ph, {size:18,color:COL.mut,align:'right'});
    txt('share of heads so far', px, py-14, {size:18,color:COL.mut}); txt('number of flips →', px+pw, py+ph+28, {size:18,color:COL.mut,align:'right'});
    c.save(); c.strokeStyle=COL.acc; c.lineWidth=3; c.beginPath();
    for(let i=0;i<n;i++){ if(flips[i]) h++; const x=px + (i/399)*pw, y=py+ph - (h/(i+1))*ph; i?c.lineTo(x,y):c.moveTo(x,y); } c.stroke(); c.restore();
    const last = flips[n-1];
    dot(190, 300, 86, last?COL.yel:COL.faint); txt(last?'H':'T', 190, 328, {size:84, weight:700, align:'center', color:COL.bg});
    txt(`flips: ${n}`, 190, 440, {size:26, align:'center'}); txt(`heads: ${(h/n*100).toFixed(1)} %`, 190, 478, {size:26, align:'center', color:COL.acc});
  }});

S.push({ title:'AND multiplies — a fraction of a fraction', dur:28,
  cap:[[0,'A thousand customers.'],[4,'Ten percent of them log in from a new device: one hundred.'],[11,'Of those hundred, two percent are fraudsters: two people.'],[17,'New device AND fraud: ten percent times two percent. Two in a thousand.'],[23,'AND always shrinks the group, so it multiplies. Adding would give a hundred and twenty — more than the hundred we started from.']],
  draw(t){
    const a1=A(t,4,1.2), a2=A(t,11,1);
    for(let i=0;i<1000;i++){ const [x,y]=gridPos(i); const inB = (i%GC)<4, red = (i===41||i===522);
      let col=COL.faint, al=1, r=5; if(inB && a1>0){ col=COL.acc; al=lerp(1,1,a1); } if(!inB && a1>0) al=lerp(1,.35,a1); if(red && a2>0){ col=COL.red; r=5+4*a2; al=1; }
      dot(x,y,r,col,al); }
    const X=810;
    txt('1,000 customers', X, 170, {size:30, weight:600, alpha:A(t,0)});
    txt('× 10 %  new device', X, 235, {size:28, color:COL.acc, alpha:A(t,4)}); txt('= 100', X+330, 235, {size:28, color:COL.acc, weight:600, alpha:A(t,5)});
    txt('×  2 %  fraud', X, 290, {size:28, color:COL.red, alpha:A(t,11)}); txt('= 2', X+330, 290, {size:28, color:COL.red, weight:600, alpha:A(t,12)});
    line(X,318,X+400,318,COL.rule,A(t,17));
    txt('P(A and B) = P(A) × P(B | A)', X, 362, {size:25, mono:true, alpha:A(t,17)});
    txt('0.10 × 0.02 = 0.002', X, 404, {size:28, mono:true, weight:600, color:COL.green, alpha:A(t,18)});
    txt('0.10 + 0.02 = 0.12  →  120 ?', X, 470, {size:24, mono:true, color:COL.mut, alpha:A(t,23)});
    if(t>24.5) line(X-4,462,X+372,462,COL.red,A(t,24.5,.4),3);
    txt('"and" can only shrink', X, 512, {size:22, color:COL.mut, alpha:A(t,25)});
  }});

S.push({ title:'OR adds — minus the overlap', dur:18,
  cap:[[0,'Thirty percent of customers pay by card. Twenty percent pay by transfer.'],[5,'Card OR transfer: add the two groups.'],[9,'But five percent do both, and adding counted them twice.'],[13,'So subtract the overlap once. Thirty plus twenty minus five: forty-five percent.']],
  draw(t){
    const cx1=420, cx2=620, cy=345, r=170;
    c.save(); c.globalAlpha=A(t,0)*.55; c.fillStyle=COL.acc; c.beginPath(); c.arc(cx1,cy,r,0,7); c.fill(); c.restore();
    c.save(); c.globalAlpha=A(t,1.5)*.55; c.fillStyle=COL.green; c.beginPath(); c.arc(cx2,cy,r*.82,0,7); c.fill(); c.restore();
    if(t>9){ c.save(); c.beginPath(); c.arc(cx1,cy,r,0,7); c.clip(); c.globalAlpha=A(t,9)*(.55+.35*Math.sin(t*6)); c.fillStyle=COL.yel; c.beginPath(); c.arc(cx2,cy,r*.82,0,7); c.fill(); c.restore(); }
    txt('Card', cx1-90, cy-20, {size:26, weight:600, align:'center', alpha:A(t,0)}); txt('30 %', cx1-90, cy+18, {size:30, align:'center', alpha:A(t,0)});
    txt('Transfer', cx2+78, cy-20, {size:26, weight:600, align:'center', alpha:A(t,1.5)}); txt('20 %', cx2+78, cy+18, {size:30, align:'center', alpha:A(t,1.5)});
    txt('both', (cx1+cx2)/2+18, cy-10, {size:20, align:'center', color:COL.bg, weight:700, alpha:A(t,9)}); txt('5 %', (cx1+cx2)/2+18, cy+18, {size:24, align:'center', color:COL.bg, weight:700, alpha:A(t,9)});
    const X=850;
    txt('P(A or B) =', X, 250, {size:26, mono:true, alpha:A(t,5)});
    txt('0.30 + 0.20', X, 300, {size:30, mono:true, alpha:A(t,5.5)});
    txt('− 0.05', X+215, 300, {size:30, mono:true, color:COL.yel, alpha:A(t,13)});
    txt(t<13 ? '= 0.50 ?' : '= 0.45', X, 356, {size:34, mono:true, weight:700, color:t<13?COL.mut:COL.green, alpha:A(t,6.5)});
    txt('P(A) + P(B) − P(A and B)', X, 430, {size:22, mono:true, color:COL.mut, alpha:A(t,13.5)});
  }});

S.push({ title:'Conditional — B becomes the whole world', dur:24,
  cap:[[0,'What is the default rate among customers who were late last month?'],[5,'Given B means: throw away everyone else. The world is now these hundred and twenty-three.'],[12,'Inside that world, forty-two defaulted.'],[16,'Forty-two out of one hundred and twenty-three: thirty-four percent. Not forty-two out of a thousand.'],[21,'A feature is useful exactly when this number differs from the base rate.']],
  draw(t){
    const a1=A(t,5,1.5), a2=A(t,12,1);
    for(let i=0;i<1000;i++){ const [x,y]=gridPos(i); const inB=setB.has(i), red=setAB.has(i);
      let col=COL.faint, al=1, r=5; if(inB){ col = (red && a2>0) ? COL.red : COL.acc; r = 5 + 1.5*a1 + (red?2*a2:0); } else al = lerp(1,.08,a1);
      dot(x,y,r,col,al); }
    const X=810;
    txt('B = late last month', X, 170, {size:28, color:COL.acc, weight:600, alpha:A(t,2)}); txt('123 customers', X, 208, {size:26, color:COL.acc, alpha:A(t,5)});
    txt('A and B = late and defaulted', X, 270, {size:24, color:COL.red, alpha:A(t,12)}); txt('42 customers', X, 306, {size:26, color:COL.red, alpha:A(t,12.5)});
    line(X,334,X+410,334,COL.rule,A(t,16));
    txt('P(A | B) = P(A and B) / P(B)', X, 376, {size:24, mono:true, alpha:A(t,16)});
    txt('42 / 123 = 34 %', X, 420, {size:32, mono:true, weight:700, color:COL.green, alpha:A(t,17)});
    txt('42 / 1,000 = 4.2 %', X, 468, {size:24, mono:true, color:COL.mut, alpha:A(t,18.5)});
    if(t>19.3) line(X-4,460,X+290,460,COL.red,A(t,19.3,.4),3);
    txt('base rate 22 %  →  34 % given late', X, 524, {size:22, color:COL.mut, alpha:A(t,21)});
  }});

S.push({ title:'Bayes — why most alerts are false', dur:38,
  cap:[[0,'One hundred thousand transactions. Fraud is zero point two percent: that thin red line on the left.'],[7,'The model catches ninety percent of fraud: one hundred and eighty.'],[12,'It also flags two percent of legitimate transactions. Two percent of a huge number: almost two thousand.'],[20,'Now stand inside the flagged world. One hundred and eighty real frauds among two thousand one hundred and seventy-six alerts.'],[27,'Probability of fraud given a flag: eight percent. A ninety percent detector, wrong ninety-two percent of the time it fires.'],[33,'The lever is the false-alarm rate. Cut it from two percent to zero point two, and precision jumps to forty-seven percent.']],
  draw(t){
    const x0=70,y0=150,w=640,h=390, fw=3;
    rect(x0+fw,y0,w-fw,h,'#22323A',A(t,0)); rect(x0,y0,fw,h,COL.red,A(t,0));
    txt('99,800 legitimate', x0+w/2, y0+h/2-50, {size:26, align:'center', color:COL.mut, alpha:A(t,1)});
    arrow(x0-34,y0-26,x0-2,y0+12,COL.red,A(t,2)); txt('200 fraud (0.2 %)', x0-40, y0-34, {size:20, color:COL.red, alpha:A(t,2)});
    txt('100,000 transactions', x0+w, y0-14, {size:18, color:COL.mut, align:'right', alpha:A(t,0)});
    txt('(yellow strip drawn 3× its true height so you can see it)', x0+w, y0+h+24, {size:15, color:COL.faint, align:'right', alpha:A(t,13)});
    rect(x0-3,y0,fw+6,h*.9,COL.red,A(t,7)*.9); txt('180 flagged', x0+16, y0+40, {size:20, color:COL.red, weight:600, alpha:A(t,8)});
    const fh=h*.02*3;  // drawn 3× taller than true scale so it is visible
    rect(x0+fw,y0+h-fh,w-fw,fh,COL.yel,A(t,12)); txt('1,996 false alarms  (2 % of 99,800)', x0+w/2, y0+h-fh-14, {size:22, align:'center', color:COL.yel, weight:600, alpha:A(t,13)});
    const X=780, a=A(t,20,1);
    txt('The flagged world', X, 180, {size:26, weight:600, alpha:a}); txt('2,176 alerts', X, 214, {size:22, color:COL.mut, alpha:a});
    const bw=430, rw=bw*180/2176; rect(X,236,bw,56,COL.yel,a); rect(X,236,rw,56,COL.red,a);
    txt('180', X+rw/2, 320, {size:18, color:COL.red, align:'center', alpha:a}); txt('1,996', X+rw+(bw-rw)/2, 320, {size:18, color:COL.yel, align:'center', alpha:a});
    txt('P(fraud | flag) = 180 / 2,176', X, 380, {size:23, mono:true, alpha:A(t,27)});
    txt('= 8.3 %', X, 432, {size:44, mono:true, weight:700, color:COL.green, alpha:A(t,28)});
    txt('recall 90 %  ≠  precision 8 %', X, 474, {size:21, color:COL.mut, alpha:A(t,29.5)});
    const b=A(t,33,1); if(b>0){ rect(X,498,bw,40,COL.panel,b,6); strokeRect(X,498,bw,40,COL.rule,b,1.5,6); txt('false alarms 2 % → 0.2 %   ⇒   precision 47 %', X+bw/2, 525, {size:19, align:'center', color:COL.acc, alpha:b}); }
  }});

S.push({ title:'Random variables — expectation and variance', dur:28,
  cap:[[0,'A random variable is a number that depends on chance. Take the profit on one loan.'],[5,'Ninety-six percent of the time you earn eighty euros. Four percent of the time you lose six hundred.'],[11,'Expected value: each outcome weighted by its probability. Fifty-two euros eighty — a number that never actually happens.'],[17,'Variance is the other half. Two portfolios with the same average loss.'],[22,'One is steady. The other is fine most months and terrible in a few. Expectation sets the price; variance sets the capital.']],
  draw(t){
    const X=80, f = A(t,17,1), top = 1-f*.0;
    c.save(); c.globalAlpha = 1 - .0*f;
    txt('Profit on a €1,000 loan', X, 160, {size:24, color:COL.mut, alpha:A(t,0)});
    const bx=X, sc=0.42;
    rect(bx, 186, 0.96*520, 44, COL.green, A(t,5)*.85); txt('96 %   repaid   +€80', bx+14, 216, {size:22, color:COL.bg, weight:600, alpha:A(t,5)});
    rect(bx, 242, Math.max(0.04*520,22), 44, COL.red, A(t,7)*.9); txt('4 %   default   −€600', bx+40, 272, {size:22, color:COL.red, weight:600, alpha:A(t,7)});
    txt('0.96 × 80', 700, 216, {size:24, mono:true, alpha:A(t,11)}); txt('= +76.8', 870, 216, {size:24, mono:true, color:COL.green, alpha:A(t,11.5)});

/* ---------- timeline ---------- */
let off=0; S.forEach((s,i)=>{ s.start=off; s.i=i; off+=s.dur; }); const TOTAL=off;
const sceneAt = T => { for(let i=S.length-1;i>=0;i--) if(T>=S[i].start) return S[i]; return S[0]; };
const capAt = (s,t) => { let k=0; for(let i=0;i<s.cap.length;i++) if(t>=s.cap[i][0]) k=i; return k; };

/* ---------- audio (WebAudio) ---------- */
let AC=null, master=null;
function audioInit(){ if(AC) return; AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.gain.value=.5; master.connect(AC.destination); }
function tone(freq, dur=.18, type='sine', vol=.18, when=0){ if(!AC || !document.getElementById('snd').checked) return; const o=AC.createOscillator(), g=AC.createGain(), t0=AC.currentTime+when; o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.012); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.02); }
const chime = () => { tone(523.25,.5,'sine',.14); tone(659.25,.5,'sine',.11,.07); tone(783.99,.7,'sine',.09,.14); };
const blip = () => tone(880,.09,'triangle',.07);

/* ---------- voice-over (Web Speech) ---------- */
// Only English voices are offered; the system default (often the OS language) is never used.
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley/i;
const PREFER = [/Google UK English Male/i, /Google UK English Female/i, /Daniel.*(Enhanced|Premium)/i, /Serena/i, /Kate/i, /Oliver/i, /^Daniel/i, /Arthur/i, /Martha/i, /Microsoft (Ryan|Sonia|Libby)/i, /Google US English/i, /Samantha.*(Enhanced|Premium)/i, /^Samantha/i, /Ava/i, /Alex/i, /Karen/i, /Moira/i];
let VOICES = [];
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) && !NOVELTY.test(v.name));
  const rank = v => { const i = PREFER.findIndex(r => r.test(v.name)); return (i<0 ? 100 : i) + (/en[-_]GB/i.test(v.lang) ? 0 : 0.5); };
  VOICES = all.sort((a,b) => rank(a)-rank(b));
  const sel = document.getElementById('voicesel'); let saved = null; try { saved = localStorage.getItem('m1voice'); } catch(e) {}
  sel.innerHTML = VOICES.length ? '' : '<option>no English voice installed</option>';
  VOICES.forEach((v,i) => { const o=document.createElement('option'); o.value=v.name; o.textContent=`${v.name} (${v.lang})`; if(saved ? v.name===saved : i===0) o.selected=true; sel.appendChild(o); });
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
document.getElementById('voicesel').addEventListener('change', e => { try { localStorage.setItem('m1voice', e.target.value); } catch(err) {} speakNow('This is the voice you selected.'); });
function speakNow(s){ if(!('speechSynthesis' in window)) return; if(!VOICES.length) loadVoices(); const v = VOICES.find(v => v.name===document.getElementById('voicesel').value) || VOICES[0]; if(!v) return;   // never fall back to a non-English default
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(s); u.voice=v; u.lang=v.lang; u.rate = 0.98*parseFloat(document.getElementById('speed').value); u.pitch=1; speechSynthesis.speak(u); }
function speak(s){ if(document.getElementById('voice').checked) speakNow(s); }

/* ---------- render ---------- */
let T=0, playing=false, last=0, prevScene=-1, prevCap=-1;
function render(){
  const s=sceneAt(T), t=T-s.start;
  c.setTransform(1,0,0,1,0,0); c.globalAlpha=1; c.fillStyle=COL.bg; c.fillRect(0,0,W,H);
  if(s.i>0){ txt(`MODULE 1 · PROBABILITY · ${s.i}/${S.length-1}`, 70, 52, {size:15, mono:true, color:COL.acc}); txt(s.title, 70, 96, {size:36, weight:700}); }
  c.save(); c.globalAlpha = Math.min(A(t,0,.4), 1 - A(t, s.dur-.35, .35)*.0); s.draw(t); c.restore();
  const k=capAt(s,t), cap=s.cap[k][1], ca=A(t, s.cap[k][0], .35);
  rect(60, 606, 1160, 92, COL.panel, .96, 10); strokeRect(60,606,1160,92,COL.rule,1,1,10);
  c.save(); c.font='400 25px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'; const one = c.measureText(cap).width <= 1100; c.restore();
  c.save(); c.globalAlpha=ca; if(one) txt(cap, 640, 661, {size:25, align:'center'}); else { c.textAlign='center'; const words=cap.split(' '); let l1='', i=0; c.font='400 25px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif'; while(i<words.length && c.measureText(l1+' '+words[i]).width<1090){ l1 += (l1?' ':'')+words[i]; i++; } txt(l1, 640, 645, {size:25, align:'center'}); txt(words.slice(i).join(' '), 640, 679, {size:25, align:'center'}); } c.restore();
  if(playing){ if(s.i!==prevScene){ chime(); } if(s.i!==prevScene || k!==prevCap){ if(s.i===prevScene) blip(); speak(cap); } }
  prevScene=s.i; prevCap=k;
  document.getElementById('fill').style.width = (T/TOTAL*100)+'%';
  const mm = x => `${Math.floor(x/60)}:${String(Math.floor(x%60)).padStart(2,'0')}`; document.getElementById('time').textContent = `${mm(T)} / ${mm(TOTAL)}`;
  document.querySelectorAll('#scenes button').forEach((b,i)=> b.classList.toggle('on', i===s.i));
}
function frame(now){ if(playing){ const dt=(now-last)/1000; last=now; T += dt*parseFloat(document.getElementById('speed').value); if(T>=TOTAL){ T=TOTAL-.01; setPlay(false); } render(); requestAnimationFrame(frame); } }
function setPlay(p){ playing=p; document.getElementById('play').textContent = p?'❚❚ Pause':'▶ Play'; if(p){ audioInit(); if(AC.state==='suspended') AC.resume(); if(T>=TOTAL-.05) T=0; prevScene=-1; prevCap=-1; last=performance.now(); requestAnimationFrame(frame); } else if('speechSynthesis' in window) speechSynthesis.cancel(); }
function seek(x){ T=clamp(x,0,TOTAL-.01); prevScene=-1; prevCap=-1; if('speechSynthesis' in window) speechSynthesis.cancel(); render(); }

track.addEventListener('click', e=>{ const r=track.getBoundingClientRect(); seek((e.clientX-r.left)/r.width*TOTAL); });
const sc=document.getElementById('scenes'); S.forEach(s=>{ const b=document.createElement('button'); b.textContent = s.i===0 ? 'Intro' : `${s.i} · ${s.title.split(' — ')[0]}`; b.onclick=()=>seek(s.start); sc.appendChild(b); });
document.getElementById('play').onclick=()=>setPlay(!playing); cv.onclick=()=>setPlay(!playing);
document.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); setPlay(!playing); } const s=sceneAt(T); if(e.code==='ArrowRight') seek(S[Math.min(s.i+1,S.length-1)].start); if(e.code==='ArrowLeft') seek(S[Math.max(s.i-(T-s.start<1.5?1:0),0)].start); });
window.__seek = seek; window.__total = TOTAL; window.__scenes = S.map(s=>({i:s.i,start:s.start,dur:s.dur,title:s.title}));
render();
})();
</script>
</body>
